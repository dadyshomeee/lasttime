<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — CutPulse Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] } } }
    }
  </script>
  <style>
    body { background-color: #09090B; color: #FAFAFA; -webkit-font-smoothing: antialiased; }
    .accent-gradient { background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%); }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <header class="h-[56px] bg-[#09090B]/80 backdrop-blur-md border-b border-white/[0.07] px-4 lg:px-6 flex items-center justify-between sticky top-0 z-50">
    <a href="/" class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-md accent-gradient flex items-center justify-center">
        <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M4 12h4l3-8 4 16 3-8h2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="font-semibold tracking-tight text-sm text-white">CutPulse</span>
      <span class="hidden sm:inline font-mono text-[10px] tracking-wider uppercase px-2 py-0.5 rounded bg-white/5 border border-white/[0.07] text-zinc-400">Studio</span>
    </a>
    <a href="/" class="text-xs font-medium text-zinc-400 hover:text-zinc-100 transition-colors">← Back to Studio</a>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-12">
    <div class="bg-[#111114] border border-white/[0.07] rounded-xl p-6 md:p-8 space-y-5">
      <div>
        <h1 class="text-xl font-bold text-zinc-100">Contact & Support</h1>
        <p class="text-xs text-zinc-400 mt-1">Have a bug report, feature request, or advertising inquiry? Reach out directly.</p>
      </div>

      <div class="bg-[#18181B] border border-white/[0.07] rounded-lg p-4 font-mono text-xs space-y-2">
        <div class="flex justify-between">
          <span class="text-zinc-500">General & Support:</span>
          <span class="text-zinc-200">support@yourdomain.com</span>
        </div>
        <div class="flex justify-between">
          <span class="text-zinc-500">Response Window:</span>
          <span class="text-zinc-400">24 – 48 Hours</span>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-white/[0.07] bg-[#09090B] py-6 px-4 text-center text-xs text-zinc-500">
    <div class="flex justify-center gap-6 mb-2">
      <a href="/" class="hover:text-zinc-200">Studio</a>
      <a href="/privacy" class="hover:text-zinc-200">Privacy Policy</a>
      <a href="/terms" class="hover:text-zinc-200">Terms of Use</a>
      <a href="/contact" class="text-zinc-300">Contact</a>
    </div>
    <p>© 2026 CutPulse Studio</p>
  </footer>
</body>
</html>
